[project]
name = "monocular-scene-diff"
version = "0.1.0"
description = "Scene change detection between two monocular RGB images using metric depth estimation."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs real pretrained models (downloads weights; enable with RUN_INTEGRATION=1)",
]
